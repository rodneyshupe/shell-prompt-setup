# Starship prompt: two-line frame, │ separators, plain-text symbols.
# Only uses characters that render in any font (no Powerline / Nerd Font glyphs needed),
# so it also works in browser terminals and over plain SSH.
#
# Corners are rounded (╭─ ╰─) unless PROMPT_CORNER_TOP / PROMPT_CORNER_BOTTOM are set (prompt.sh sets
# the square ┌─ └─ for terminals whose font draws the rounded ones unevenly, see PROMPT_SQUARE_FROM).
# Preview a change without opening a new shell:  starship prompt

format = """
${env_var.PROMPT_CORNER_TOP}[ ](bold 34)(${env_var.PROMPT_BLOCK_CAP_L}${env_var.PROMPT_SSH_LABEL}${env_var.PROMPT_BLOCK_CAP_R}[ ](bold 34))$time[ │ ](bold 34)$username$hostname( ${custom.vipcapl}${custom.vip}${custom.vipcapr})[ │ ](bold 34)$directory\
([ │ ](bold 34)$git_branch$git_status${custom.gitsync})$cmd_duration$status $all\
${env_var.PROMPT_CORNER_BOTTOM}$character"""

# Corner characters: the env var wins, the default is rounded.
[env_var.PROMPT_CORNER_TOP]
default = "╭─"
format = "[$env_value](bold 34)"

[env_var.PROMPT_CORNER_BOTTOM]
default = "╰─"
format = "[$env_value](bold 34)"

# Shown only in an ssh session: tells a remote host from the local machine. prompt.sh sets PROMPT_SSH_LABEL
# to `ssh` (one hop), `ssh2` (ssh from an ssh session), `ssh3`, ... (208 = orange. In an ssh session
# prompt.sh also switches to starship-ssh.toml, generated from this file by install.sh with the green frame
# replaced by orange.)
[env_var.PROMPT_SSH_LABEL]
format = "[ $env_value ](bold fg:16 bg:208)"   # fg:16 = true black; plain `black` is drawn dark grey by many terminals when bold

# Rounded ends for the ssh block (opt-in: install.sh --round-block, which sets PROMPT_ROUND_BLOCK=1). prompt.sh then sets
# these two to the half circles ◖ and ◗ (plain Unicode, no patched font), in orange on the normal background, so the
# block reads as a pill. Not set for a client listed in PROMPT_SQUARE_FROM (its font is the reason for square corners).
# The whole group is in parentheses in `format`, so it is hidden unless one of them is set.
[env_var.PROMPT_BLOCK_CAP_L]
format = "[$env_value](fg:208)"

[env_var.PROMPT_BLOCK_CAP_R]
format = "[$env_value](fg:208)"

[character]
success_symbol = "[>](bold 34)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold 34)"

[time]
disabled = false
time_format = "%-I:%M %p"
style = "white"
format = "[$time]($style)"

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold 207"   # magenta: distinct from the cyan user color, the green frame and the orange ssh frame
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = ""
style = "bold 34"   # same as the frame; starship-ssh.toml turns it (and the frame) orange in an ssh session
format = "[@](white)[$hostname]($style)"

[directory]
style = "bold white"
format = "[$path]($style)"
truncation_length = 6
truncation_symbol = "…/"
read_only = " ro"

[git_branch]
symbol = "git "
format = "[$symbol$branch]($style)"

[git_status]
format = "([ $all_status]($style))"   # ahead/behind: see custom.gitsync below
renamed = "r"
deleted = "x"

# Shown only for commands that run longer than 2 seconds
[cmd_duration]
style = "yellow"
format = "[ │ ](bold 34)[took $duration]($style)"

# Shown only when the last command failed
[status]
disabled = false
style = "bold red"
format = "[ │ ](bold 34)[exit $status( $common_meaning)( $signal_name)]($style)"

[container]
disabled = true

# Ahead/behind the upstream branch: `>` one commit ahead, `>3` three ahead, `<` one behind, `<2` two
# behind, `> <2` both. Counts only above 1. Only inside a repo that has an upstream; costs one
# `git rev-list` per prompt there (and a failed one elsewhere). Only as fresh as the last `git fetch`.
[custom.gitsync]
when = true   # custom modules are off unless `when` is set; the command prints nothing outside a repo
command = '''git rev-list --left-right --count '@{upstream}...HEAD' 2>/dev/null | awk '{b=$1; a=$2; o=""; if (a>0) {o=">"; if (a>1) o=o a} if (b>0) {if (o!="") o=o " "; o=o "<"; if (b>1) o=o b} printf "%s", o}''''
style = "bold red"
format = "([ $output]($style))"

# Optional marker for a host that holds a floating/virtual IP (keepalived, HA pairs, ...): a black-on-green block,
# rounded the same way as the ssh block (the caps are PROMPT_BLOCK_CAP_L / _R, set by prompt.sh in an ssh session
# when --round-block is on, and green here). Set PROMPT_VIP=<address> in settings.sh (install.sh --vip <address>
# does that); the block shows only while this host has that address. Unset: nothing is shown.
# The three modules use the same `when`; the caps print nothing when no caps are set, so the group in `format`
# collapses to the plain square block. (40 = green.)
[custom.vip]
when = '[ -n "$PROMPT_VIP" ] && ip -4 -o addr show 2>/dev/null | grep -q " $PROMPT_VIP/"'
command = "echo VIP"
style = "bold fg:16 bg:40"
format = "[ $output ]($style)"

[custom.vipcapl]
when = '[ -n "$PROMPT_VIP" ] && ip -4 -o addr show 2>/dev/null | grep -q " $PROMPT_VIP/"'
command = 'printf %s "$PROMPT_BLOCK_CAP_L"'
format = "[$output](fg:40)"

[custom.vipcapr]
when = '[ -n "$PROMPT_VIP" ] && ip -4 -o addr show 2>/dev/null | grep -q " $PROMPT_VIP/"'
command = 'printf %s "$PROMPT_BLOCK_CAP_R"'
format = "[$output](fg:40)"

