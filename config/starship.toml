# Starship prompt: two-line frame, │ separators, plain-text symbols.
# Only uses characters that render in any font (no Powerline / Nerd Font glyphs needed),
# so it also works in browser terminals and over plain SSH.
#
# To switch to rounded corners, change "┌─" to "╭─" and "└─" to "╰─" in `format`.
# Preview a change without opening a new shell:  starship prompt

format = """
[┌─ ](bold blue)$time[ │ ](bold blue)$username$hostname${custom.vip}[ │ ](bold blue)$directory\
([ │ ](bold blue)$git_branch$git_status)$cmd_duration$status $all\
[└─](bold blue)$character"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[time]
disabled = false
time_format = "%-I:%M %p"
style = "white"
format = "[$time]($style)"

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = ""
style = "bold green"
format = "[@](white)[$hostname]($style)"

[directory]
style = "bold white"
format = "[$path]($style)"
truncation_length = 6
truncation_symbol = "…/"
read_only = " ro"

[git_branch]
symbol = "git "
format = "[$symbol$branch]($style)"

[git_status]
format = "([ $all_status$ahead_behind]($style))"
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

# Shown only for commands that run longer than 2 seconds
[cmd_duration]
style = "yellow"
format = "[ │ ](bold blue)[took $duration]($style)"

# Shown only when the last command failed
[status]
disabled = false
style = "bold red"
format = "[ │ ](bold blue)[exit $status( $common_meaning)( $signal_name)]($style)"

[container]
disabled = true

# Optional marker for a host that holds a floating/virtual IP (keepalived, HA pairs, ...).
# Set PROMPT_VIP=<address> in ~/.zshrc.local (install.sh --vip <address> does that); the
# marker shows only while this host has that address. Unset: nothing is shown.
[custom.vip]
when = '[ -n "$PROMPT_VIP" ] && ip -4 -o addr show 2>/dev/null | grep -q " $PROMPT_VIP/"'
command = "echo VIP"
style = "bold yellow"
format = "[ \\[$output\\]]($style)"

