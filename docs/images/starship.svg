<text x="404" y="18" fill="#9d9d9d" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Starship prompt (install.sh)</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<text x="18" y="56" fill="#8b8b8b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Your own machine: a git repo with changes, two commits ahead of its upstream</text>
