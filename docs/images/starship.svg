<text x="102.00" y="80.00" fill="#2472c8" font-weight="700" textLength="25.20" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> │ </text>
<text x="127.20" y="80.00" fill="#11a8cd" font-weight="700" textLength="42.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">alice</text>
<text x="169.20" y="80.00" fill="#e5e5e5" textLength="8.40" lengthAdjust="spacingAndGlyphs" xml:space="preserve">@</text>
<text x="177.60" y="80.00" fill="#2472c8" font-weight="700" textLength="75.60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">laptop │ </text>
<text x="253.20" y="80.00" fill="#e5e5e5" font-weight="700" textLength="109.20" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…/project/src</text>
<text x="362.40" y="80.00" fill="#2472c8" font-weight="700" textLength="25.20" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> │ </text>
<text x="387.60" y="80.00" fill="#bc3fbc" font-weight="700" textLength="67.20" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git main</text>
<text x="454.80" y="80.00" fill="#cd3131" font-weight="700" textLength="50.40" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> !? &gt;2</text>
<text x="18.00" y="100.00" fill="#2472c8" font-weight="700" textLength="16.80" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╰─</text>
<text x="34.80" y="100.00" fill="#0dbc79" font-weight="700" textLength="8.40" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt;</text>
<rect x="60.00" y="89.00" width="8.40" height="14" fill="#d4d4d4" opacity="0.8"/>
<text x="18" y="132" fill="#8b8b8b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Over ssh: orange frame and an ssh block</text>
